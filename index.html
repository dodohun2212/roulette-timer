<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="룰렛 타이머">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0A0F0C">
<title>룰렛 타이머</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;400&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
  :root {
    --felt:    #0A0F0C;
    --line:    #26332B;
    --ivory:   #EDE7DC;
    --dim:     #6E7B72;
    --brass:   #C9A227;
    --go:      #157A46;
    --go-hi:   #1D9E59;
    --stop:    #A8232A;
    --stop-hi: #C93038;
    --wait:    #1A231D;
    --r: 26px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--felt);
    color: var(--ivory);
    font-family: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: manipulation;
    overflow: hidden;
  }

  .deck {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px 18px 18px;
    padding-block-start: max(20px, env(safe-area-inset-top));
    padding-block-end: max(18px, env(safe-area-inset-bottom));
  }

  .bar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .mark {
    font-size: 12px; font-weight: 600;
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--brass);
  }
  .state {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 13px; color: var(--dim); letter-spacing: .04em;
  }
  #dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--line);
    transition: background .12s linear, box-shadow .12s linear;
  }
  #dot.lit {
    background: var(--brass);
    box-shadow: 0 0 10px 1px rgba(201, 162, 39, .55);
    transition: none;
  }

  .readout {
    flex: 0 0 auto;
    display: flex; align-items: baseline; justify-content: center;
    gap: .12em;
    padding: 4px 0 2px;
  }
  #time {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    font-size: clamp(56px, 13vh, 132px);
    line-height: 1;
    letter-spacing: -.03em;
    color: var(--dim);
    transition: color .25s;
  }
  #time.on { color: var(--ivory); }
  .unit { font-size: clamp(18px, 3.2vh, 30px); font-weight: 400; color: var(--dim); }

  #btn {
    flex: 1 1 auto;
    width: 100%;
    min-height: 170px;
    border: 0; border-radius: var(--r);
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
    font-size: clamp(58px, 15vh, 150px);
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--ivory);
    background: var(--go);
    box-shadow: inset 0 0 0 1px rgba(237, 231, 220, .09);
    transition: background .2s, transform .09s, color .2s;
  }
  #btn.stop  { background: var(--stop); }
  #btn.wait  { background: var(--wait); color: var(--dim); font-size: clamp(30px, 7vh, 66px); letter-spacing: .06em; }
  #btn.press { transform: scale(.987); background: var(--go-hi); }
  #btn.stop.press { background: var(--stop-hi); }
  #btn:focus-visible { outline: 3px solid var(--brass); outline-offset: 4px; }

  #hint {
    flex: 0 0 auto; margin: 0; min-height: 17px;
    text-align: center; font-size: 12.5px; color: var(--dim);
    letter-spacing: .02em;
    transition: opacity .3s;
  }
  #hint.off { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    #btn, #time, #dot, #hint { transition: none; }
  }
</style>
</head>
<body>

<div class="deck">
  <header class="bar">
    <span class="mark">Roulette Timer</span>
    <span class="state"><i id="dot"></i><span id="status">대기 중</span></span>
  </header>

  <div class="readout">
    <span id="time">0.0</span><span class="unit">초</span>
  </div>

  <button id="btn" type="button">시작</button>

  <p id="hint">소리가 안 나면 무음 모드를 끄고 볼륨을 올리세요</p>
</div>

<script>
(function () {
  'use strict';

  var TICK_FAST = 0.062;   // 도는 중 틱 간격(초)
  var TICK_SLOW = 0.42;    // 감속 끝 틱 간격(초)
  var DECEL     = 1.8;     // 감속에 걸리는 시간(초)

  var btn    = document.getElementById('btn');
  var time   = document.getElementById('time');
  var hint   = document.getElementById('hint');
  var dot    = document.getElementById('dot');
  var status = document.getElementById('status');

  var ctx = null, master = null, noise = null;
  var state = 'idle';                 // idle | running | stopping
  var sched = null, nextTick = 0, decelFrom = 0;
  var startedAt = 0, raf = null;
  var lastPress = 0, wake = null, blinks = [];

  /* ---------- 오디오 ---------- */
  function audio() {
    if (ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);

    var n = Math.floor(ctx.sampleRate * 0.03);
    noise = ctx.createBuffer(1, n, ctx.sampleRate);
    var d = noise.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  }

  function tick(t, vol) {
    var src = ctx.createBufferSource();
    src.buffer = noise;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 2200 + Math.random() * 900;
    bp.Q.value = 1.7;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.02, vol), t + 0.0012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t); src.stop(t + 0.06);
    blink(t);
  }

  // 무음 모드에서도 돌아가는 걸 눈으로 확인할 수 있게, 틱에 맞춰 표시등을 깜빡임
  function blink(t) {
    var wait = Math.max(0, (t - ctx.currentTime) * 1000);
    blinks.push(setTimeout(function () {
      dot.classList.add('lit');
      blinks.push(setTimeout(function () { dot.classList.remove('lit'); }, 46));
    }, wait));
    if (blinks.length > 80) blinks = blinks.slice(-40);
  }

  function ding(t) {
    [[880, 0.30], [1318.5, 0.16]].forEach(function (p) {
      var o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = p[0];
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(p[1], t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 1.5);
    });
  }

  function pump() {
    var ahead = ctx.currentTime + 0.12;
    while (nextTick < ahead) {
      if (state === 'stopping') {
        var p = (nextTick - decelFrom) / DECEL;
        if (p >= 1) { settle(nextTick); return; }
        tick(nextTick, 0.9 - 0.45 * p);
        nextTick += TICK_FAST * Math.pow(TICK_SLOW / TICK_FAST, p);
      } else {
        tick(nextTick, 0.9);
        nextTick += TICK_FAST * (0.9 + Math.random() * 0.2);
      }
    }
  }

  /* ---------- 상태 ---------- */
  function paint() {
    btn.className   = state === 'running' ? 'stop'      : state === 'stopping' ? 'wait'      : '';
    btn.textContent = state === 'running' ? '정지'      : state === 'stopping' ? '멈추는 중' : '시작';
    status.textContent = state === 'running' ? '도는 중' : state === 'stopping' ? '감속'      : '대기 중';
    time.className = state === 'idle' ? '' : 'on';
    hint.className = state === 'idle' ? '' : 'off';
  }

  function show(sec) {
    var s = Math.max(0, sec);
    time.textContent = s >= 60
      ? Math.floor(s / 60) + ':' + ('0' + Math.floor(s % 60)).slice(-2) + '.' + Math.floor((s * 10) % 10)
      : s.toFixed(1);
  }

  function loop() {
    if (state !== 'running') return;
    show((Date.now() - startedAt) / 1000);
    raf = requestAnimationFrame(loop);
  }

  function go() {
    state = 'running';
    startedAt = Date.now();
    nextTick = ctx.currentTime + 0.02;
    sched = setInterval(pump, 25);
    pump();
    paint(); loop(); lock();
  }

  function halt() {
    show((Date.now() - startedAt) / 1000);   // 버튼 누른 순간으로 시간 고정
    cancelAnimationFrame(raf);
    state = 'stopping';
    decelFrom = ctx.currentTime;
    paint();
  }

  function settle(t) {
    clearInterval(sched); sched = null;
    ding(t);
    state = 'idle';
    paint(); release();
    setTimeout(function () { dot.classList.remove('lit'); }, 200);
  }

  /* ---------- 화면 꺼짐 방지 ---------- */
  function lock() {
    try {
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(function (w) { wake = w; }, function () {});
      }
    } catch (e) {}
  }
  function release() {
    try { if (wake) wake.release(); } catch (e) {}
    wake = null;
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && state !== 'idle') lock();
  });

  /* ---------- 입력 ---------- */
  function press(e) {
    if (e) e.preventDefault();
    var now = Date.now();
    if (now - lastPress < 280) return;       // 중복 탭 방지
    lastPress = now;

    audio();
    if (ctx.state === 'suspended') ctx.resume();

    if (state === 'idle') go();
    else if (state === 'running') halt();
  }

  btn.addEventListener('pointerdown', function (e) { btn.classList.add('press'); press(e); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    btn.addEventListener(ev, function () { btn.classList.remove('press'); });
  });
  btn.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); press(null); }
  });
  btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  paint();

  /* ---------- 오프라인 캐시 ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>

</body>
</html>
