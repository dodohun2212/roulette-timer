<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="룰렛 타이머">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#13120D">
<title>룰렛 타이머</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@200;400&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
  :root {
    --soil:     #13120D;   /* 흙 — 바탕 */
    --line:     #3A3524;
    --seed:     #EFE7D2;   /* 씨앗 — 본문 */
    --dim:      #8A8468;
    --sprout:   #9BCB3B;   /* 새싹 — 강조 */
    --leaf:     #2F7D43;   /* 잎 — 시작 */
    --leaf-hi:  #3D9B55;
    --clay:     #B4472F;   /* 화분 — 정지 */
    --clay-hi:  #CE5738;
    --rest:     #23211A;
    --r: 26px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--soil);
    color: var(--seed);
    font-family: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: manipulation;
    overflow: hidden;
  }

  .deck {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 18px;
    padding-block-start: max(18px, env(safe-area-inset-top));
    padding-block-end: max(16px, env(safe-area-inset-bottom));
  }

  /* --- 이름표 --- */
  .tag {
    flex: 0 0 auto;
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding-bottom: 11px;
    border-bottom: 1px dashed var(--line);
  }
  .who {
    font-family: "Gowun Batang", serif;
    font-size: 15px; font-weight: 700;
    letter-spacing: .14em;
    color: var(--sprout);
  }
  .who em {
    font-style: normal; font-weight: 400;
    color: var(--dim); letter-spacing: .1em;
    margin-left: .55em;
  }
  .state {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 13px; color: var(--dim); letter-spacing: .06em;
  }
  #dot {
    width: 11px; height: 11px;
    border-radius: 50% 0 50% 50%;
    transform: rotate(-45deg);
    background: var(--line);
    transition: background .12s linear, box-shadow .12s linear;
  }
  #dot.lit {
    background: var(--sprout);
    box-shadow: 0 0 11px 1px rgba(155, 203, 59, .5);
    transition: none;
  }

  /* --- 시간 + 새싹 --- */
  .readout {
    flex: 0 0 auto;
    display: flex; align-items: flex-end; justify-content: center;
    gap: 16px;
    padding: 6px 0 2px;
  }
  .figures { display: flex; align-items: baseline; gap: .1em; }
  #time {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    font-size: clamp(54px, 12.5vh, 124px);
    line-height: 1;
    letter-spacing: -.03em;
    color: var(--dim);
    transition: color .25s;
  }
  #time.on { color: var(--seed); }
  .unit {
    font-size: clamp(17px, 3vh, 28px);
    font-weight: 400; color: var(--dim);
  }

  /* 시간이 갈수록 자라는 새싹 */
  #sprout {
    width: clamp(34px, 7vh, 62px);
    height: auto;
    margin-bottom: 4px;
    transform-origin: 50% 100%;
    transform: scaleY(var(--g, .42)) scaleX(calc(.62 + var(--g, .42) * .38));
    opacity: calc(.35 + var(--g, .42) * .65);
    transition: transform .45s cubic-bezier(.2, .7, .3, 1), opacity .45s;
  }
  #sprout .stem {
    stroke: var(--leaf); stroke-width: 3.4; stroke-linecap: round; fill: none;
  }
  #sprout .lf-a { fill: var(--leaf); }
  #sprout .lf-b { fill: var(--sprout); }

  /* --- 버튼 --- */
  #btn {
    flex: 1 1 auto;
    width: 100%;
    min-height: 168px;
    border: 0; border-radius: var(--r);
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
    font-size: clamp(56px, 14.5vh, 146px);
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--seed);
    background: var(--leaf);
    box-shadow: inset 0 0 0 1px rgba(239, 231, 210, .1);
    transition: background .2s, transform .09s, color .2s, font-size .2s;
  }
  #btn.stop { background: var(--clay); }
  #btn.wait {
    background: var(--rest); color: var(--dim);
    font-size: clamp(28px, 6.5vh, 62px); letter-spacing: .06em;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  #btn.press { transform: scale(.987); background: var(--leaf-hi); }
  #btn.stop.press { background: var(--clay-hi); }
  #btn:focus-visible { outline: 3px solid var(--sprout); outline-offset: 4px; }

  #hint {
    flex: 0 0 auto; margin: 0; min-height: 16px;
    text-align: center; font-size: 12px; color: var(--dim);
    letter-spacing: .02em;
    transition: opacity .3s;
  }
  #hint.off { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    #btn, #time, #dot, #hint, #sprout { transition: none; }
  }
</style>
</head>
<body>

<div class="deck">
  <header class="tag">
    <span class="who">식물 자치회<em>제비뽑기</em></span>
    <span class="state"><i id="dot"></i><span id="status">파종 대기</span></span>
  </header>

  <div class="readout">
    <svg id="sprout" viewBox="0 0 44 52" aria-hidden="true">
      <path class="stem" d="M22 50 L22 20"/>
      <path class="lf-a" d="M22 30C11.5 30 6 23.5 6 15.5c9.6 0 15.4 5.6 16 14.5Z"/>
      <path class="lf-b" d="M22 24C32.5 24 38 17.5 38 9.5c-9.6 0-15.4 5.6-16 14.5Z"/>
    </svg>

    <div class="figures">
      <span id="time">0.0</span><span class="unit">초</span>
    </div>
  </div>

  <button id="btn" type="button">시작</button>

  <p id="hint">소리가 안 나면 무음 모드를 끄고 볼륨을 올리세요</p>
</div>

<script>
(function () {
  'use strict';

  var TICK_FAST = 0.058;   // 도는 중 틱 간격(초)
  var TICK_SLOW = 0.40;    // 감속 끝 틱 간격(초)
  var DECEL     = 2.0;     // 감속에 걸리는 시간(초)
  var GROW_FULL = 30;      // 새싹이 다 자라는 데 걸리는 시간(초)

  var btn    = document.getElementById('btn');
  var time   = document.getElementById('time');
  var hint   = document.getElementById('hint');
  var dot    = document.getElementById('dot');
  var status = document.getElementById('status');
  var sprout = document.getElementById('sprout');

  var ctx = null, bus = null, shortNoise = null, longNoise = null;
  var bedGain = null, bedNodes = [];
  var state = 'idle';                 // idle | running | stopping
  var sched = null, nextTick = 0, decelFrom = 0;
  var startedAt = 0, raf = null;
  var lastPress = 0, wake = null, blinks = [];

  /* ---------- 오디오 준비 ---------- */
  function audio() {
    if (ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();

    // 여러 소리가 겹쳐도 찌그러지지 않게 컴프레서를 물린다
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 18;
    comp.ratio.value = 5;
    comp.attack.value = 0.003;
    comp.release.value = 0.18;

    bus = ctx.createGain();
    bus.gain.value = 0.9;
    bus.connect(comp);
    comp.connect(ctx.destination);

    shortNoise = makeNoise(0.03, true);
    longNoise  = makeNoise(2.0, false);
  }

  function makeNoise(sec, decay) {
    var n = Math.floor(ctx.sampleRate * sec);
    var b = ctx.createBuffer(1, n, ctx.sampleRate);
    var d = b.getChannelData(0);
    for (var i = 0; i < n; i++) {
      d[i] = (Math.random() * 2 - 1) * (decay ? (1 - i / n) : 1);
    }
    return b;
  }

  /* ---------- 휠이 도는 저음 (바닥에 깔리는 소리) ---------- */
  function bedOn() {
    var src = ctx.createBufferSource();
    src.buffer = longNoise;
    src.loop = true;

    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 420;
    bp.Q.value = 0.9;

    // 회전하는 느낌을 주는 느린 흔들림
    var lfo = ctx.createOscillator();
    lfo.frequency.value = 2.7;
    var lfoAmt = ctx.createGain();
    lfoAmt.gain.value = 165;
    lfo.connect(lfoAmt);
    lfoAmt.connect(bp.frequency);

    bedGain = ctx.createGain();
    bedGain.gain.setValueAtTime(0.0001, ctx.currentTime);
    bedGain.gain.linearRampToValueAtTime(0.19, ctx.currentTime + 0.3);

    src.connect(bp); bp.connect(bedGain); bedGain.connect(bus);
    src.start(); lfo.start();
    bedNodes = [src, lfo];
  }

  function bedOff(t, fade) {
    if (!bedGain) return;
    bedGain.gain.cancelScheduledValues(t);
    bedGain.gain.setValueAtTime(bedGain.gain.value, t);
    bedGain.gain.linearRampToValueAtTime(0.0001, t + fade);
    bedNodes.forEach(function (n) { try { n.stop(t + fade + 0.1); } catch (e) {} });
    bedNodes = [];
    bedGain = null;
  }

  /* ---------- 공이 굴러가는 틱 ---------- */
  function tick(t, vol) {
    // 나무 림에 부딪히는 몸통 — 노이즈
    var src = ctx.createBufferSource();
    src.buffer = shortNoise;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 2300 + Math.random() * 950;
    bp.Q.value = 1.8;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.02, vol), t + 0.0012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.033);
    src.connect(bp); bp.connect(g); g.connect(bus);
    src.start(t); src.stop(t + 0.06);

    // 금속성 — 짧은 고음 한 점
    var o = ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = 3100 + Math.random() * 800;
    var og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(Math.max(0.01, vol * 0.34), t + 0.001);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.022);
    o.connect(og); og.connect(bus);
    o.start(t); o.stop(t + 0.04);

    blink(t);
  }

  // 무음 모드에서도 돌아가는 걸 눈으로 확인할 수 있게, 틱에 맞춰 잎을 깜빡임
  function blink(t) {
    var wait = Math.max(0, (t - ctx.currentTime) * 1000);
    blinks.push(setTimeout(function () {
      dot.classList.add('lit');
      blinks.push(setTimeout(function () { dot.classList.remove('lit'); }, 44));
    }, wait));
    if (blinks.length > 80) blinks = blinks.slice(-40);
  }

  /* ---------- 출발할 때 훅 올라가는 소리 ---------- */
  function whoosh(t) {
    var src = ctx.createBufferSource();
    src.buffer = longNoise;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.3;
    bp.frequency.setValueAtTime(320, t);
    bp.frequency.exponentialRampToValueAtTime(2600, t + 0.34);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.24, t + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    src.connect(bp); bp.connect(g); g.connect(bus);
    src.start(t); src.stop(t + 0.46);
  }

  /* ---------- 당첨 종소리 (3음) ---------- */
  function chime(t) {
    [[659.25, 0], [987.77, 0.105], [1318.51, 0.21]].forEach(function (n) {
      var s = t + n[1];

      var o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = n[0];
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.26, s + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 1.5);
      o.connect(g); g.connect(bus);
      o.start(s); o.stop(s + 1.6);

      // 배음 한 겹 — 종처럼 들리게
      var h = ctx.createOscillator();
      h.type = 'sine';
      h.frequency.value = n[0] * 2.01;
      var hg = ctx.createGain();
      hg.gain.setValueAtTime(0.0001, s);
      hg.gain.exponentialRampToValueAtTime(0.075, s + 0.004);
      hg.gain.exponentialRampToValueAtTime(0.0001, s + 0.7);
      h.connect(hg); hg.connect(bus);
      h.start(s); h.stop(s + 0.8);
    });
  }

  /* ---------- 틱 스케줄러 ---------- */
  function pump() {
    var ahead = ctx.currentTime + 0.12;
    while (nextTick < ahead) {
      if (state === 'stopping') {
        var p = (nextTick - decelFrom) / DECEL;
        if (p >= 1) { settle(nextTick); return; }
        tick(nextTick, 0.92 - 0.42 * p);
        nextTick += TICK_FAST * Math.pow(TICK_SLOW / TICK_FAST, p);
      } else {
        tick(nextTick, 0.92);
        nextTick += TICK_FAST * (0.9 + Math.random() * 0.2);
      }
    }
  }

  /* ---------- 상태 ---------- */
  function paint() {
    btn.className   = state === 'running' ? 'stop'      : state === 'stopping' ? 'wait'      : '';
    btn.textContent = state === 'running' ? '정지'      : state === 'stopping' ? '멈추는 중' : '시작';
    status.textContent = state === 'running' ? '섞는 중' : state === 'stopping' ? '마무리'   : '파종 대기';
    time.className = state === 'idle' ? '' : 'on';
    hint.className = state === 'idle' ? '' : 'off';
  }

  function grow(sec) {
    sprout.style.setProperty('--g', (0.42 + 0.58 * Math.min(1, sec / GROW_FULL)).toFixed(3));
  }

  function show(sec) {
    var s = Math.max(0, sec);
    time.textContent = s >= 60
      ? Math.floor(s / 60) + ':' + ('0' + Math.floor(s % 60)).slice(-2) + '.' + Math.floor((s * 10) % 10)
      : s.toFixed(1);
  }

  function loop() {
    if (state !== 'running') return;
    var sec = (Date.now() - startedAt) / 1000;
    show(sec); grow(sec);
    raf = requestAnimationFrame(loop);
  }

  function go() {
    state = 'running';
    startedAt = Date.now();
    nextTick = ctx.currentTime + 0.02;
    whoosh(ctx.currentTime);
    bedOn();
    sched = setInterval(pump, 25);
    pump();
    paint(); loop(); lock();
  }

  function halt() {
    show((Date.now() - startedAt) / 1000);   // 버튼 누른 순간으로 시간 고정
    cancelAnimationFrame(raf);
    state = 'stopping';
    decelFrom = ctx.currentTime;
    paint();
  }

  // 감속이 끝나면: 공이 칸에 떨어져 몇 번 튀고 → 종소리
  function settle(t) {
    clearInterval(sched); sched = null;
    bedOff(t, 0.4);

    var at = t;
    for (var i = 0; i < 7; i++) {
      tick(at, 0.85 * Math.pow(0.79, i));
      at += 0.048 + Math.random() * 0.1 + i * 0.014;
    }

    var end = at + 0.12;
    chime(end);

    setTimeout(function () {
      state = 'idle';
      paint(); release();
      dot.classList.remove('lit');
    }, Math.max(0, (end - ctx.currentTime) * 1000));
  }

  /* ---------- 화면 꺼짐 방지 ---------- */
  function lock() {
    try {
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(function (w) { wake = w; }, function () {});
      }
    } catch (e) {}
  }
  function release() {
    try { if (wake) wake.release(); } catch (e) {}
    wake = null;
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && state !== 'idle') lock();
  });

  /* ---------- 입력 ---------- */
  function press(e) {
    if (e) e.preventDefault();
    var now = Date.now();
    if (now - lastPress < 280) return;       // 중복 탭 방지
    lastPress = now;

    audio();
    if (ctx.state === 'suspended') ctx.resume();

    if (state === 'idle') { grow(0); go(); }
    else if (state === 'running') halt();
  }

  btn.addEventListener('pointerdown', function (e) { btn.classList.add('press'); press(e); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    btn.addEventListener(ev, function () { btn.classList.remove('press'); });
  });
  btn.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); press(null); }
  });
  btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  paint(); grow(0);

  /* ---------- 오프라인 캐시 ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>

</body>
</html>
